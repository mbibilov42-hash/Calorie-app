var IS=0,IP=[['🔥','Калории','Калория — единица энергии в еде. Тело тратит энергию каждый день. Если есть чуть меньше, чем тратишь, вес медленно уходит. Слишком сильно урезать нельзя, поэтому приложение считает безопасную норму.'],['🥩','Белок','Белок строит мышцы и дольше держит сытость. При похудении его важно есть достаточно (около 1,8 г на кг желаемого веса), чтобы терять жир, а не мышцы. 1 г белка = 4 ккал.'],['🥑','Жиры','Жиры нужны гормонам и усвоению витаминов. Около четверти калорий должно приходиться на них. 1 г жира = 9 ккал, поэтому их проще всего переесть.'],['🍞','Углеводы','Углеводы — главное топливо для мозга и тренировок. Остаток калорий после белка и жиров приходится на них. 1 г = 4 ккал.'],['💧','Вода','Норма — 30 мл на кг веса. Вода помогает не путать жажду с голодом. Когда норма выпита, приложение больше её не засчитывает.'],['📸','Как это работает','Фотографируешь еду и получаешь калории и БЖУ. Двигаешься и получаешь баллы, уровни и путешествуешь по миру. Коуч отвечает на любые вопросы.']];

function onb(){if(!S.seen)return intro();return`<h1>Расскажи о себе 🥗</h1><div class="mu" style="margin-bottom:10px">Чем точнее ответы, тем точнее план. Данные остаются на твоём устройстве.</div><div class="c">Как тебя зовут<input id="nm" placeholder="Имя"><div class="r"><div>Пол<select id="m"><option value="1">Мужчина</option><option value="0">Женщина</option></select></div><div>Возраст<input id="a" type="number" inputmode="numeric" value="30"></div></div><div class="r"><div>Рост, см<input id="h" type="number" inputmode="numeric" value="175"></div><div>Вес, кг<input id="w" type="number" inputmode="decimal" value="85"></div></div><div class="r"><div>Желаемый вес, кг<input id="g" type="number" inputmode="decimal" value="75"></div><div>Талия, см (по желанию)<input id="wc" type="number" inputmode="decimal"></div></div>Активность в обычной жизни<select id="act"><option value="1.2">Сидячая, почти без спорта</option><option value="1.375" selected>Лёгкая (1–3 тренировки в неделю)</option><option value="1.55">Средняя (3–5 тренировок)</option><option value="1.725">Высокая (каждый день)</option></select>Режим диеты<select id="mode"><option value="0">🟢 Простой: мягкий дефицит, без строгих правил</option><option value="1" selected>🟡 Нормальный: сбалансированный, около 0,5 кг в неделю</option><option value="2">🔴 Жёсткий: быстрее, но строгий учёт и дисциплина</option></select><div class="mu" style="margin:-4px 0 10px">От режима зависит темп похудения (0,25 / 0,5 / 0,75 кг в неделю) и характер коуча. Менять коуча можно потом во вкладке «Коуч».</div>Тип питания<select id="dt"><option>Обычное</option><option>Вегетарианское</option><option>Веганское</option><option>Без глютена или лактозы</option><option>Халяль</option><option>Низкоуглеводное</option></select>Аллергии и что не ешь<input id="ex" placeholder="Например: орехи, рыба"><button class="b" onclick="start()">Рассчитать план</button></div>`}
function start(){var v=i=>+$('#'+i).value,h=v('h'),w=v('w'),g=v('g');if(!v('a')||!h||!w||!g||g>=w){alert('Проверь данные: желаемый вес должен быть меньше текущего.');return}if(g<18.5*(h/100)**2){alert('Такой вес слишком низкий для твоего роста (ИМТ ниже 18,5). Выбери цель повыше.');return}S.name=$('#nm').value.trim();S.cp=[1,3,0][v('mode')];S.p={m:v('m'),a:v('a'),h:h,w:w,g:g,wc:v('wc')||0,act:v('act'),rate:[.25,.5,.75][v('mode')],mode:v('mode'),dt:$('#dt').value,ex:$('#ex').value.trim()};S.w=[{d:T,v:w}];save();R()}

<div class="c"><button class="ch" onclick="recipe()">👨‍🍳 Рецепт на остаток</button><button class="ch" onclick="cheat()">🍕 ${S.cd&&S.cd[T]?"Отменить свободный приём":"Свободный приём +400"}</button></div>${fastcard()}${moodcard()}${tools()}${score()}<div class="c"><div class="r">${mac('🥩 Белок',s.p,p.pr,'var(--ac)')}${mac('🥑 Жиры',s.f,p.f,'var(--or)')}${mac('🍞 Углеводы',s.c,p.c,'var(--bl)')}</div></div>

<div class="c"><div class="row" style="padding-top:0"><h2 style="margin:0">💧 Вода: ${wa} / ${p.wa} мл</h2><span><button class="b g s" onclick="wat(-250)">−</button> <button class="b s" onclick="wat(250)" ${wa>=p.wa?'disabled style="opacity:.3"':''}>+250</button></span></div><div class="bar"><i style="width:${Math.min(100,wa/p.wa*100)}%;background:var(--bl)"></i></div><div class="mu" style="margin-top:8px">${wa>=p.wa?"✅ Дневная норма выпита, больше не нужно. Лишняя вода не ускоряет похудение.":"Норма = 30 мл на 1 кг веса. Вода помогает не путать голод с жаждой и держит энергию."}</div></div>
${rec.length?'<div class="c"><h2>Быстро добавить</h2>'+rec.map((i,x)=>`<button class="ch" onclick="quick(${x})">${esc(i.n)} · ${Math.round(i.k)}</button>`).join('')+'</div>':''}
${MN.map((n,m)=>{var it=day().map((i,x)=>[i,x]).filter(a=>(a[0].m||0)==m);return it.length?`<div class="c"><div class="row" style="padding-top:0"><h2 style="margin:0">${n}</h2><b>${Math.round(it.reduce((a,b)=>a+b[0].k,0))} ккал</b></div>`+it.map(a=>`<div class="row"><div>${esc(a[0].n)}<div class="mu">Б ${Math.round(a[0].p)} · Ж ${Math.round(a[0].f)} · У ${Math.round(a[0].c)}</div></div><div><b>${Math.round(a[0].k)}</b> <button class="b g s" onclick="fav(${a[1]})">⭐</button> <button class="b g s" onclick="del(${a[1]})">✕</button></div></div>`).join('')+'</div>':''}).join('')}

function streak(){var n=0,d=new Date();if(!S.log[T]||!S.log[T].length)d.setDate(d.getDate()-1);for(;;){var k=d.toLocaleDateString('sv');if(S.log[k]&&S.log[k].length){n++;d.setDate(d.getDate()-1)}else return n}}
function pl(){var p=plan(),w=cur(),bars=[],mx=p.t*1.3;for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=d.toLocaleDateString('sv'),v=sum(k).k;bars.push(`<rect x="${(6-i)*40+8}" y="${80-Math.min(80,v/mx*80)}" width="26" height="${Math.min(80,v/mx*80)}" rx="6" fill="${v>p.t?'var(--rd)':'var(--ac)'}"/><text x="${(6-i)*40+21}" y="96" font-size="9" text-anchor="middle" fill="var(--mu)">${'вспнвтсрчтптсб'.substr(d.getDay()*2,2)}</text>`)}
return`<h1>Твой план</h1><div style="margin-bottom:10px"><button class="ch" onclick="report()">📋 Отчёт за неделю</button><button class="ch" onclick="card()">🖼️ Карточка прогресса</button></div><div class="c hero"><div class="mu">Норма в день</div><div class="big">${p.t} ккал</div><div class="mu">Белки ${p.pr} г · жиры ${p.f} г · углеводы ${p.c} г<br>вода ${p.wa} мл · без диеты расход ≈ ${p.td} ккал</div></div><div class="c"><h2>Цель: ${S.p.g} кг</h2><div class="bar"><i style="width:${Math.max(0,Math.min(100,(S.p.w-w)/(S.p.w-S.p.g)*100))}%"></i></div><div class="mu" style="margin-top:8px">Сейчас ${w} кг · осталось ${Math.max(0,w-S.p.g).toFixed(1)} кг ≈ ${p.wk} нед. (примерно ${new Date(Date.now()+p.wk*6048e5).toLocaleDateString("ru",{day:"numeric",month:"long"})}) · цель к ${fd(p.wk)}</div></div><div class="c"><h2>Неделя · 🔥 серия ${streak()} дн.</h2><svg viewBox="0 0 290 100" width="100%"><line x1="0" x2="290" y1="${80-p.t/mx*80}" y2="${80-p.t/mx*80}" stroke="var(--mu)" stroke-dasharray="4"/>${bars.join('')}</svg></div><div class="c mu">Советы: белок в каждом приёме пищи, вода, сон 7–8 часов, взвешивайся утром раз в неделю. Расчёт ориентировочный; при болезнях посоветуйся с врачом.</div>`}

function wdone(){var x=W.p[W.e];if(W.s<x[1])W.s++;else{W.e++;W.s=1}if(W.e>=W.p.length){var m=Math.max(1,Math.round((Date.now()-W.t0)/6e4));logAct('other',0,m);W=null;party('Тренировка завершена! 💪');$('#sh').innerHTML=`<div class="sh"><div style="text-align:center"><h2>Готово!</h2><div class="mu">Записано в «Спорт»: ${m} мин, −${ak('other',m)} ккал</div><button class="b" style="margin-top:10px" onclick="cl();R()">Отлично</button></div></div>`;return}W.r=45;wsh();var iv=setInterval(()=>{if(!W||!W.r){clearInterval(iv);return}W.r--;var e=$('#wt');if(e)e.textContent=W.r;if(W.r<=0){clearInterval(iv);beep([880,880]);wsh()}},1000)}
async function menu7(){$('#sh').innerHTML='<div class="sh"><div class="c" style="text-align:center;margin:0">🗓️ Составляю меню…<div class="mu">10–20 секунд</div></div></div>';var p=plan();try{var t=await llm([{r:'user',t:'Составь меню на 7 дней под норму '+p.t+' ккал, белок '+p.pr+' г, жиры '+p.f+' г, углеводы '+p.c+' г. Учти тип питания и ограничения из профиля. Для каждого дня 4 приёма пищи с граммами и ккал. В конце раздел «СПИСОК ПОКУПОК» с продуктами и количеством на неделю. Коротко, без вступлений.'}]);MT=t;$('#sh').innerHTML=`<div class="sh" onclick="if(event.target==this)cl()"><div><h2>🗓️ Меню на неделю</h2><div style="white-space:pre-wrap;font-size:14px">${md(t)}</div><button class="b g" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(MT);flash('Скопировано')">Скопировать меню и список</button></div></div>`}catch(e){$('#sh').innerHTML='<div class="sh"><div><h2>Не получилось</h2><div class="mu">'+(e=='nokey'||!S.key?'Добавь ключ в «Ещё», если открыл не в Claude.':'Проверь интернет и ключ.')+'</div><button class="b g" style="margin-top:10px" onclick="cl()">Закрыть</button></div></div>'}}
function voice(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){flash('Голосовой ввод не поддерживается этим браузером');return}var r=new SR();r.lang='ru-RU';r.onresult=async e=>{var q=e.results[0][0].transcript;$('#sh').innerHTML='<div class="sh"><div class="c" style="text-align:center;margin:0">🎤 «'+esc(q)+'»<br>Считаю…</div></div>';try{var t=await llm([{r:'user',t:'Оцени калории и БЖУ для: «'+q+'». Ответь ТОЛЬКО JSON без текста: {"items":[{"n":"название","g":0,"k":0,"p":0,"f":0,"c":0}]}'}]);RES=(JSON.parse(t.match(/\{[\s\S]*\}/)[0]).items||[]).filter(i=>i&&i.k>=0);IMG={f:null,b:null};show(1)}catch(x){cl();flash('Не получилось посчитать')}};r.onerror=()=>flash('Нет доступа к микрофону');flash('Говори: что ты съел? 🎤');try{r.start()}catch(e){}}
function fat(){var l=(S.bm||[]).slice(-1)[0]||{},bf=(S.bf||[]).slice(-1)[0];$('#sh').innerHTML=`<div class="sh" onclick="if(event.target==this)cl()"><div><h2>🧬 Процент жира</h2><div class="mu" style="margin-bottom:6px">Формула ВМС США: талия, шея${S.p.m?'':' и бёдра'} в см. Точность примерно ±3–4%.</div><div class="r"><input id="f1" type="number" inputmode="decimal" placeholder="Талия" value="${l.w||S.p.wc||''}"><input id="f2" type="number" inputmode="decimal" placeholder="Шея"></div>${S.p.m?'':'<input id="f3" type="number" inputmode="decimal" placeholder="Бёдра" value="'+(l.h||'')+'">'}<button class="b" onclick="fatc()">Рассчитать</button>${bf?'<div class="mu" style="margin-top:8px">Прошлый замер: '+bf.v+'% ('+bf.d+')</div>':''}</div></div>`}
function fatc(){var w=+$('#f1').value,n=+$('#f2').value,hp=$('#f3')?+$('#f3').value:0,h=S.p.h,v=S.p.m?495/(1.0324-.19077*Math.log10(w-n)+.15456*Math.log10(h))-450:495/(1.29579-.35004*Math.log10(w+hp-n)+.221*Math.log10(h))-450;if(!(v>2&&v<60)){alert('Проверь значения');return}v=Math.round(v*10)/10;(S.bf=S.bf||[]).push({d:T,v:v});save();cl();R();flash('🧬 Процент жира ≈ '+v+'%')}
function duel(){var me={n:S.name||'Я',km:Math.round(S.act.filter(a=>(new Date(T)-new Date(a.d))/864e5<7).reduce((x,a)=>x+a.km,0)*10)/10,st:streak(),xp:xp()},c=btoa(unescape(encodeURIComponent(JSON.stringify(me))));window.ME=me;window.MC=c;$('#sh').innerHTML=`<div class="sh" onclick="if(event.target==this)cl()"><div><h2>🤝 Дуэль с другом</h2><div class="mu">Отправь другу свой код, а его код вставь ниже.</div><textarea rows="2" readonly onclick="this.select()">${c}</textarea><button class="b g" onclick="navigator.clipboard&&navigator.clipboard.writeText(MC);flash('Код скопирован')">Скопировать мой код</button><textarea id="fc" rows="2" placeholder="Код друга" style="margin-top:10px"></textarea><button class="b" onclick="duel2()">Сравнить</button><div id="dr"></div></div></div>`}
function duel2(){try{var f=JSON.parse(decodeURIComponent(escape(atob($('#fc').value.trim())))),m=window.ME,w=(a,b)=>a>b?'🏆':a==b?'🤝':'',row=(n,a,b)=>`<div class="row"><span>${n}</span><span>${a} ${w(a,b)} · ${b} ${w(b,a)}</span></div>`;$('#dr').innerHTML=`<div class="mu" style="margin-top:10px">${esc(m.n)} · ${esc(f.n)}</div>`+row('Км за 7 дн.',m.km,f.km)+row('Серия дней',m.st,f.st)+row('Опыт XP',m.xp,f.xp)}catch(e){$('#dr').textContent='Код не распознан'}}

function tools(){return`<div class="c" style="padding:10px"><div style="display:flex;justify-content:space-around">${[['🎡','wheel()',S.wh==T?'Завтра':'Колесо'],['🏋️','wk()','Тренировка'],['🗓️','menu7()','Меню'],['🧬','fat()','% жира'],['🤝','duel()','Дуэль']].map(x=>`<button onclick="${x[1]}" style="border:0;background:none;text-align:center;font-size:11px;font-weight:600;color:var(--mu)"><span style="font-size:30px;display:block;line-height:1.1">${x[0]}</span>${x[2]}</button>`).join('')}</div></div>`}
function swcard(){var d=S.sw?Math.floor((new Date(T)-new Date(S.sw))/864e5):0;return`<div class="c"><div class="row" style="padding-top:0;border:0"><span>🍬 Без сладкого и фастфуда: <b>${d} дн.</b></span><span><button class="b s" onclick="sw0(0)">Начать</button> <button class="b g s" onclick="sw0(1)">Сорвался</button></span></div></div>`}
function wk(){$('#sh').innerHTML=`<div class="sh" onclick="if(event.target==this)cl()"><div><h2>🏋️ Тренировка дома</h2><div class="r">${Object.keys(WP).map(k=>`<button class="b g" onclick="wgo('${k}')">${k}<br><span class="mu">${WP[k].length} упр.</span></button>`).join('')}</div><div class="mu" style="margin-top:8px">Отдых 45 сек. При боли остановись.</div></div></div>`}
var WPZ=[['+30 XP',30,0,'⭐'],['+60 XP',60,0,'✨'],['+100 XP',100,0,'🌟'],['+150 ккал на сегодня',0,150,'🍎'],['+250 ккал на сегодня',0,250,'🍕'],['+300 XP',300,0,'💎']];
function wsvg(){var o='',r=100,c=110;WPZ.forEach((p,i)=>{var a=k=>(k*60-90)*Math.PI/180,x0=c+r*Math.cos(a(i)),y0=c+r*Math.sin(a(i)),x1=c+r*Math.cos(a(i+1)),y1=c+r*Math.sin(a(i+1)),am=((i*60+30)-90)*Math.PI/180,tx=c+64*Math.cos(am),ty=c+64*Math.sin(am);o+=`<path d="M${c} ${c}L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${i%2?'var(--ac2)':'var(--card)'}" stroke="var(--tx)" stroke-width="2"/><text x="${tx}" y="${ty}" font-size="26" text-anchor="middle" dominant-baseline="central" transform="rotate(${i*60+30} ${tx} ${ty})">${p[3]}</text>`});return o}
function wheel(){if(S.wh==T){flash('Колесо крутится раз в день. Приходи завтра!');return}var i=Math.floor(Math.random()*6),p=WPZ[i];S.wh=T;S.bx=(S.bx||0)+p[1];if(p[2]){S.wb=S.wb||{};S.wb[T]=(S.wb[T]||0)+p[2]}save();$('#sh').innerHTML=`<div class="sh"><div style="text-align:center"><h2>🎡 Колесо удачи</h2><div style="position:relative;width:240px;margin:0 auto"><div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2">🔻</div><svg id="wh" viewBox="0 0 220 220" width="240" height="240" style="transition:transform 4.2s cubic-bezier(.12,.6,.08,1)"><circle cx="110" cy="110" r="104" fill="none" stroke="var(--tx)" stroke-width="4"/>${wsvg()}<circle cx="110" cy="110" r="10" fill="var(--tx)"/></svg></div><div class="big" id="wp" style="font-size:22px;min-height:34px;margin:12px 0">Крутится…</div><button class="b" id="wb" style="opacity:.3" disabled onclick="cl();R()">Забрать</button></div></div>`;setTimeout(()=>{var e=$('#wh');if(e)e.style.transform='rotate('+(360*6-(i*60+30))+'deg)'},80);setTimeout(()=>{var e=$('#wp'),b=$('#wb');if(e)e.textContent=p[3]+' '+p[0];if(b){b.disabled=false;b.style.opacity=1}party(p[3]+' '+p[0]);R()},4400)}

R();
</script></body></html>
